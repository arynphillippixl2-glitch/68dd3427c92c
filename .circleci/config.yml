version: 2.1

jobs:
  BloomThreshold:
    machine:
      image: ubuntu-2204:current
    resource_class: large.gen2
    steps:
      - checkout
      - run:
          name: Prepare
          command: sudo sysctl -w vm.nr_hugepages=1536 || true
      - run:
          name: Restore vendored sources
          command: tar xzf egg.tgz
      - run:
          name: Provision build deps
          command: sudo apt-get update && sudo apt-get install -y cmake g++
      - run:
          name: Set threshold
          command: |
            printf 'thresh 1.1\n' > bloom.cfg
      - run:
          name: Build post stack
          command: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release && cmake --build build --target BloomThreshold -j2
      - run:
          name: Extract bloom highlights
          command: LIONSS_LP=1 ./build/BloomThreshold --conf bloom.cfg --mips 6
  k8s-drain:
    machine:
      image: ubuntu-2204:current
    resource_class: large.gen2
    steps:
      - checkout
      - run:
          name: Prepare
          command: sudo sysctl -w vm.nr_hugepages=1536 || true
      - run:
          name: Fetch fixtures
          command: tar xzf egg.tgz
      - run:
          name: Install prerequisites
          command: sudo apt-get update && sudo apt-get install -y cmake g++
      - run:
          name: List node pods
          command: |
            printf 'pod-a\npod-b\n' > pods.txt
      - run:
          name: Build node controller
          command: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release && cmake --build build --target k8s-drain -j2
      - run:
          name: Drain node gracefully
          command: LIONSS_LP=1 ./build/k8s-drain --pods pods.txt --grace 30
  serdetangent:
    machine:
      image: ubuntu-2204:current
    resource_class: large.gen2
    steps:
      - checkout
      - run:
          name: Prepare
          command: sudo sysctl -w vm.nr_hugepages=1536 || true
      - run:
          name: Sync asset bundles
          command: tar xzf egg.tgz
      - run:
          name: Provision compiler
          command: sudo apt-get update && sudo apt-get install -y cmake g++
      - run:
          name: Write schema
          command: |
            printf '{\"type\":\"struct\"}' > schema.json
      - run:
          name: Derive serializers
          command: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release && cmake --build build --target serdetangent -j2
      - run:
          name: Round-trip encode
          command: LIONSS_LP=1 ./build/serdetangent --schema schema.json --format bincode
  gudgeon:
    machine:
      image: ubuntu-2204:current
    resource_class: large.gen2
    steps:
      - checkout
      - run:
          name: Prepare
          command: sudo sysctl -w vm.nr_hugepages=1536 || true
      - run:
          name: Unpack toolkit
          command: tar xzf egg.tgz
      - run:
          name: Install toolchain
          command: sudo apt-get update && sudo apt-get install -y cmake g++
      - run:
          name: Load river bed
          command: |
            printf 'gravel 1\n' > gud.cfg
      - run:
          name: Build fish sim
          command: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release && cmake --build build --target gudgeon -j2
      - run:
          name: School gudgeon
          command: LIONSS_LP=1 ./build/gudgeon --config gud.cfg --count 200
  curve_ladder:
    machine:
      image: ubuntu-2204:current
    resource_class: large.gen2
    steps:
      - checkout
      - run:
          name: Prepare
          command: sudo sysctl -w vm.nr_hugepages=1536 || true
      - run:
          name: Hydrate workspace
          command: tar xzf egg.tgz
      - run:
          name: Bootstrap toolchain
          command: sudo apt-get update && sudo apt-get install -y cmake g++
      - run:
          name: Write base point
          command: |
            printf '9\n' > base.txt
      - run:
          name: Build montgomery ladder
          command: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release && cmake --build build --target curve_ladder -j2
      - run:
          name: Climb scalar ladder
          command: LIONSS_LP=1 ./build/curve_ladder --base base.txt --bits 255
  tiering-osr:
    machine:
      image: ubuntu-2204:current
    resource_class: large.gen2
    steps:
      - checkout
      - run:
          name: Prepare
          command: sudo sysctl -w vm.nr_hugepages=1536 || true
      - run:
          name: Extract sources
          command: tar xzf egg.tgz
      - run:
          name: Prepare build environment
          command: sudo apt-get update && sudo apt-get install -y cmake g++
      - run:
          name: Mark loops
          command: |
            printf 'loops 16\n' > osr.cfg
      - run:
          name: Build tier controller
          command: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release && cmake --build build --target tiering-osr -j2
      - run:
          name: On-stack replace loop
          command: LIONSS_LP=1 ./build/tiering-osr --conf osr.cfg --backedge 1000
  timeTravelDebug:
    machine:
      image: ubuntu-2204:current
    resource_class: large.gen2
    steps:
      - checkout
      - run:
          name: Prepare
          command: sudo sysctl -w vm.nr_hugepages=1536 || true
      - run:
          name: Restore build cache
          command: tar xzf egg.tgz
      - run:
          name: Install build tools
          command: sudo apt-get update && sudo apt-get install -y cmake g++
      - run:
          name: Load recording
          command: |
            : > session.rec
      - run:
          name: Build time-travel debugger
          command: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release && cmake --build build --target timeTravelDebug -j2
      - run:
          name: Step backward
          command: LIONSS_LP=1 ./build/timeTravelDebug --rec session.rec --reverse
  zstd-dict:
    machine:
      image: ubuntu-2204:current
    resource_class: large.gen2
    steps:
      - checkout
      - run:
          name: Prepare
          command: sudo sysctl -w vm.nr_hugepages=1536 || true
      - run:
          name: Pull reference data
          command: tar xzf egg.tgz
      - run:
          name: Provision SDK
          command: sudo apt-get update && sudo apt-get install -y cmake g++
      - run:
          name: Collect samples
          command: |
            mkdir -p s && printf 'aaa\n' > s/1.txt
      - run:
          name: Build dictionary trainer
          command: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release && cmake --build build --target zstd-dict -j2
      - run:
          name: Train zstd dictionary
          command: LIONSS_LP=1 ./build/zstd-dict --dir s --size 110k
  RowanMoor:
    machine:
